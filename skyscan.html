<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyScan - Deep Detail Aviation Analytics</title>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Custom scrollbar matching the design */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="bg-gray-900 text-white overflow-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- LUCIDE ICONS SETUP ---
        // Helper component to render Lucide icons from the global 'lucide' object
        const LucideIcon = ({ name, size = 24, color = "currentColor", ...props }) => {
            const iconDef = lucide.icons[name];
            if (!iconDef) {
                console.warn(`Icon "${name}" not found in lucide.icons`);
                return null;
            }

            return (
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width={size}
                    height={size}
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke={color}
                    strokeWidth="2"
                    strokeLinecap="round"
                    strokeLinejoin="round"
                    {...props}
                >
                    {iconDef.map(([tag, attrs], i) => React.createElement(tag, { ...attrs, key: i }))}
                </svg>
            );
        };

        // Map the specific icons used in the code to components
        const iconNames = [
            'Plane', 'MapPin', 'Search', 'Calendar', 'ArrowRight', 'Home',
            'Navigation', 'DollarSign', 'Info', 'Shield', 'Filter', 'Menu',
            'User', 'Settings', 'X'
        ];

        const Icons = iconNames.reduce((acc, name) => {
            acc[name] = (props) => <LucideIcon name={name} {...props} />;
            return acc;
        }, {});

        // Destructure icons for easy usage in the App component
        const {
            Plane, MapPin, Search, Calendar, ArrowRight, Home, Navigation,
            DollarSign, Info, Shield, Filter, Menu, User, Settings, X
        } = Icons;

        // --- DATA: COMPREHENSIVE US AIRPORT LIST (Top 50+ Hubs) ---
        const US_AIRPORTS = [
            { code: 'ATL', city: 'Atlanta', name: 'Hartsfield-Jackson Intl', lat: 33.6407, lng: -84.4277 },
            { code: 'LAX', city: 'Los Angeles', name: 'Los Angeles Intl', lat: 33.9416, lng: -118.4085 },
            { code: 'ORD', city: 'Chicago', name: "O'Hare Intl", lat: 41.9742, lng: -87.9073 },
            { code: 'DFW', city: 'Dallas/Fort Worth', name: 'Dallas/Fort Worth Intl', lat: 32.8998, lng: -97.0403 },
            { code: 'DEN', city: 'Denver', name: 'Denver Intl', lat: 39.8561, lng: -104.6737 },
            { code: 'JFK', city: 'New York', name: 'John F. Kennedy Intl', lat: 40.6413, lng: -73.7781 },
            { code: 'SFO', city: 'San Francisco', name: 'San Francisco Intl', lat: 37.6213, lng: -122.3790 },
            { code: 'SEA', city: 'Seattle', name: 'Seattle-Tacoma Intl', lat: 47.4502, lng: -122.3088 },
            { code: 'LAS', city: 'Las Vegas', name: 'Harry Reid Intl', lat: 36.0840, lng: -115.1537 },
            { code: 'MCO', city: 'Orlando', name: 'Orlando Intl', lat: 28.4312, lng: -81.3081 },
            { code: 'EWR', city: 'Newark', name: 'Newark Liberty Intl', lat: 40.6895, lng: -74.1745 },
            { code: 'CLT', city: 'Charlotte', name: 'Charlotte Douglas Intl', lat: 35.2140, lng: -80.9431 },
            { code: 'PHX', city: 'Phoenix', name: 'Phoenix Sky Harbor Intl', lat: 33.4341, lng: -112.0080 },
            { code: 'IAH', city: 'Houston', name: 'George Bush Intercontinental', lat: 29.9902, lng: -95.3368 },
            { code: 'MIA', city: 'Miami', name: 'Miami Intl', lat: 25.7959, lng: -80.2870 },
            { code: 'BOS', city: 'Boston', name: 'Logan Intl', lat: 42.3656, lng: -71.0096 },
            { code: 'MSP', city: 'Minneapolis', name: 'Minneapolis-Saint Paul Intl', lat: 44.8848, lng: -93.2223 },
            { code: 'DTW', city: 'Detroit', name: 'Detroit Metropolitan', lat: 42.2162, lng: -83.3554 },
            { code: 'FLL', city: 'Fort Lauderdale', name: 'Fort Lauderdale-Hollywood Intl', lat: 26.0742, lng: -80.1506 },
            { code: 'PHL', city: 'Philadelphia', name: 'Philadelphia Intl', lat: 39.8729, lng: -75.2437 },
            { code: 'LGA', city: 'New York', name: 'LaGuardia', lat: 40.7769, lng: -73.8740 },
            { code: 'BWI', city: 'Baltimore', name: 'Baltimore/Washington Intl', lat: 39.1774, lng: -76.6684 },
            { code: 'SLC', city: 'Salt Lake City', name: 'Salt Lake City Intl', lat: 40.7899, lng: -111.9791 },
            { code: 'SAN', city: 'San Diego', name: 'San Diego Intl', lat: 32.7338, lng: -117.1933 },
            { code: 'IAD', city: 'Washington D.C.', name: 'Dulles Intl', lat: 38.9531, lng: -77.4565 },
            { code: 'DCA', city: 'Washington D.C.', name: 'Reagan National', lat: 38.8512, lng: -77.0402 },
            { code: 'MDW', city: 'Chicago', name: 'Midway Intl', lat: 41.7868, lng: -87.7522 },
            { code: 'TPA', city: 'Tampa', name: 'Tampa Intl', lat: 27.9772, lng: -82.5309 },
            { code: 'PDX', city: 'Portland', name: 'Portland Intl', lat: 45.5898, lng: -122.5951 },
            { code: 'HNL', city: 'Honolulu', name: 'Daniel K. Inouye Intl', lat: 21.3187, lng: -157.9225 },
        ];

        // --- MOCK FLIGHT DATA GENERATOR ---
        const generateFlights = (fromCode, toCode) => {
            const airlines = ['Delta', 'American', 'United', 'Southwest', 'JetBlue', 'Alaska'];
            const aircrafts = ['Boeing 737 MAX', 'Airbus A321neo', 'Boeing 787-9', 'Airbus A350-900'];

            return Array.from({ length: 4 }).map((_, i) => ({
                id: i,
                airline: airlines[Math.floor(Math.random() * airlines.length)],
                code: `${String.fromCharCode(65+Math.floor(Math.random()*26))}${String.fromCharCode(65+Math.floor(Math.random()*26))}-${100 + Math.floor(Math.random()*800)}`,
                departure: `${8 + i}:00 ${i < 4 ? 'AM' : 'PM'}`,
                arrival: `${11 + i}:30 ${i < 4 ? 'AM' : 'PM'}`,
                duration: '3h 30m',
                price: 250 + Math.floor(Math.random() * 300),
                stops: Math.random() > 0.7 ? '1 Stop' : 'Non-stop',
                aircraft: aircrafts[Math.floor(Math.random() * aircrafts.length)],
                emissions: `${100 + Math.floor(Math.random() * 100)} kg CO2`,
                class: i === 3 ? 'First Class' : 'Economy'
            }));
        };

        // --- GOOGLE MAPS LOADER ---
        const loadGoogleMapsScript = (apiKey) => {
            return new Promise((resolve, reject) => {
                if (window.google && window.google.maps) {
                    resolve(window.google.maps);
                    return;
                }
                const script = document.createElement('script');
                script.src = `https://maps.googleapis.com/maps/api/js?key=${apiKey}&libraries=places,geometry`;
                script.async = true;
                script.defer = true;
                script.onload = () => resolve(window.google.maps);
                script.onerror = (err) => reject(err);
                document.head.appendChild(script);
            });
        };

        function App() {
            const API_KEY = 'AIzaSyBtLqcOldhNoMCzwFXenupP15_AcydjNJQ';

            // Refs
            const mapRef = useRef(null);
            const homeInputRef = useRef(null);

            // Map State
            const [googleMaps, setGoogleMaps] = useState(null);
            const [mapInstance, setMapInstance] = useState(null);
            const [directionsService, setDirectionsService] = useState(null);
            const [directionsRenderer, setDirectionsRenderer] = useState(null);
            const [placesService, setPlacesService] = useState(null);

            // App State
            const [activeTab, setActiveTab] = useState('flights');
            const [flightResults, setFlightResults] = useState([]);
            const [isSearching, setIsSearching] = useState(false);
            const [commuteData, setCommuteData] = useState(null);
            const [destinationCity, setDestinationCity] = useState(null);

            // Form State
            const [fromSearch, setFromSearch] = useState('');
            const [toSearch, setToSearch] = useState('');
            const [showFromSuggestions, setShowFromSuggestions] = useState(false);
            const [showToSuggestions, setShowToSuggestions] = useState(false);

            const [flightForm, setFlightForm] = useState({
                from: null, // Stores full airport object
                to: null,   // Stores full airport object
                date: '',
                passengers: 1
            });

            const [commuteAddress, setCommuteAddress] = useState('');
            const [selectedHomeAirport, setSelectedHomeAirport] = useState(US_AIRPORTS.find(a => a.code === 'JFK'));

            // --- INITIALIZATION ---
            useEffect(() => {
                loadGoogleMapsScript(API_KEY).then((maps) => {
                    setGoogleMaps(maps);

                    // Initialize 3D Map
                    const map = new maps.Map(mapRef.current, {
                        center: { lat: 39.8283, lng: -98.5795 }, // Center of US
                        zoom: 4,
                        mapTypeId: 'satellite', // Satellite for 3D look
                        tilt: 45, // Enable 45-degree imagery
                        heading: 0,
                        disableDefaultUI: true,
                        zoomControl: false,
                        mapTypeControl: false,
                        scaleControl: false,
                        streetViewControl: false,
                        rotateControl: true,
                        fullscreenControl: false,
                    });

                    setMapInstance(map);
                    setDirectionsService(new maps.DirectionsService());
                    setDirectionsRenderer(new maps.DirectionsRenderer({
                        map,
                        suppressMarkers: false,
                        polylineOptions: { strokeColor: '#10b981', strokeWeight: 5 }
                    }));
                    setPlacesService(new maps.places.PlacesService(map));

                }).catch(err => console.error("Maps Load Error:", err));
            }, []);

            // --- AUTOCOMPLETE FOR HOME ADDRESS ---
            useEffect(() => {
                if (googleMaps && homeInputRef.current && activeTab === 'commute') {
                    const autocomplete = new googleMaps.places.Autocomplete(homeInputRef.current, {
                        types: ['address'],
                        componentRestrictions: { country: 'us' }
                    });

                    autocomplete.addListener('place_changed', () => {
                        const place = autocomplete.getPlace();
                        if (place.formatted_address) {
                            setCommuteAddress(place.formatted_address);
                        }
                    });
                }
            }, [googleMaps, activeTab]);


            // --- HANDLERS ---

            // Filter Airports
            const getFilteredAirports = (query) => {
                if (!query) return [];
                const q = query.toLowerCase();
                return US_AIRPORTS.filter(a =>
                    a.code.toLowerCase().includes(q) ||
                    a.city.toLowerCase().includes(q) ||
                    a.name.toLowerCase().includes(q)
                );
            };

            const handleSelectAirport = (type, airport) => {
                if (type === 'from') {
                    setFlightForm(prev => ({ ...prev, from: airport }));
                    setFromSearch(`${airport.code} - ${airport.city}`);
                    setShowFromSuggestions(false);
                } else {
                    setFlightForm(prev => ({ ...prev, to: airport }));
                    setToSearch(`${airport.code} - ${airport.city}`);
                    setShowToSuggestions(false);
                }
            };

            const handleSearchFlights = (e) => {
                e.preventDefault();
                if (!flightForm.from || !flightForm.to) {
                    alert("Please select valid airports from the dropdown.");
                    return;
                }

                setIsSearching(true);
                setDestinationCity(null);

                // 1. Simulate API Call
                setTimeout(() => {
                    const results = generateFlights(flightForm.from.code, flightForm.to.code);
                    setFlightResults(results);
                    setIsSearching(false);
                    setDestinationCity(flightForm.to.city);

                    // 2. FLY TO DESTINATION ON MAP
                    if (mapInstance && flightForm.to) {
                        mapInstance.panTo({ lat: flightForm.to.lat, lng: flightForm.to.lng });

                        // Smooth Zoom Animation
                        let zoomLevel = 4;
                        const targetZoom = 13;
                        const zoomInterval = setInterval(() => {
                            if (zoomLevel < targetZoom) {
                                zoomLevel += 0.5;
                                mapInstance.setZoom(zoomLevel);
                            } else {
                                clearInterval(zoomInterval);
                                mapInstance.setTilt(45); // Ensure 3D tilt at the end
                                mapInstance.setHeading(90); // Rotate for dramatic effect
                            }
                        }, 100);
                    }
                }, 2000);
            };

            const handleCalculateCommute = (e) => {
                e.preventDefault();
                if (!commuteAddress || !selectedHomeAirport) {
                    alert("Please enter a home address and select an airport.");
                    return;
                }

                if (!directionsService || !directionsRenderer) return;

                // Use the coordinates of the selected airport for precision
                const airportLocation = new googleMaps.LatLng(selectedHomeAirport.lat, selectedHomeAirport.lng);

                directionsService.route(
                    {
                        origin: commuteAddress,
                        destination: airportLocation, // Precise lat/lng
                        travelMode: googleMaps.TravelMode.DRIVING,
                        provideRouteAlternatives: true
                    },
                    (result, status) => {
                        if (status === googleMaps.DirectionsStatus.OK) {
                            directionsRenderer.setDirections(result);
                            const leg = result.routes[0].legs[0];
                            setCommuteData({
                                distance: leg.distance.text,
                                duration: leg.duration.text,
                                start: leg.start_address,
                                end: `${selectedHomeAirport.name} (${selectedHomeAirport.code})`
                            });

                            // Fit bounds to show the whole route
                            const bounds = new googleMaps.LatLngBounds();
                            bounds.extend(leg.start_location);
                            bounds.extend(leg.end_location);
                            mapInstance.fitBounds(bounds);

                        } else {
                            console.error("Directions failed:", status);
                            alert("Could not calculate route. Please verify the address.");
                        }
                    }
                );
            };

            return (
                <div className="relative w-full h-screen overflow-hidden bg-gray-900 text-white font-sans selection:bg-blue-500 selection:text-white">

                    {/* 3D MAP BACKGROUND */}
                    <div ref={mapRef} className="absolute inset-0 z-0 bg-gray-900" />

                    {/* Dynamic Overlay Gradient - changes based on context */}
                    <div className={`absolute inset-0 z-0 pointer-events-none transition-colors duration-1000 ${destinationCity ? 'bg-black/30' : 'bg-black/50'}`} />

                    {/* Main Container */}
                    <div className="relative z-10 h-full flex flex-col md:flex-row">

                        {/* GLASSMORPHISM SIDEBAR */}
                        <div className="w-full md:w-[500px] h-full bg-slate-900/60 backdrop-blur-2xl border-r border-white/10 flex flex-col shadow-2xl relative">

                            {/* Top Bar */}
                            <div className="p-6 border-b border-white/10 flex justify-between items-center bg-white/5">
                                <div>
                                    <h1 className="text-2xl font-black italic tracking-tighter flex items-center gap-2 text-white">
                                        <Plane className="w-6 h-6 text-blue-500" />
                                        SKY<span className="text-blue-500">SCAN</span>
                                    </h1>
                                    <p className="text-blue-200/50 text-[10px] uppercase tracking-widest mt-1">Deep Detail Aviation Analytics</p>
                                </div>
                                <div className="flex gap-2">
                                    <button className="p-2 rounded-full hover:bg-white/10 transition-colors"><User className="w-5 h-5 text-gray-400" /></button>
                                    <button className="p-2 rounded-full hover:bg-white/10 transition-colors"><Settings className="w-5 h-5 text-gray-400" /></button>
                                </div>
                            </div>

                            {/* Navigation */}
                            <div className="p-4 grid grid-cols-2 gap-2">
                                <button
                                    onClick={() => setActiveTab('flights')}
                                    className={`py-3 px-4 rounded-xl flex items-center justify-center gap-2 font-medium transition-all duration-300 ${activeTab === 'flights' ? 'bg-blue-600 text-white shadow-lg shadow-blue-500/25 ring-1 ring-blue-400' : 'bg-white/5 text-gray-400 hover:bg-white/10'}`}
                                >
                                    <Search className="w-4 h-4" /> Flight Scanner
                                </button>
                                <button
                                    onClick={() => setActiveTab('commute')}
                                    className={`py-3 px-4 rounded-xl flex items-center justify-center gap-2 font-medium transition-all duration-300 ${activeTab === 'commute' ? 'bg-emerald-600 text-white shadow-lg shadow-emerald-500/25 ring-1 ring-emerald-400' : 'bg-white/5 text-gray-400 hover:bg-white/10'}`}
                                >
                                    <Navigation className="w-4 h-4" /> Home Planner
                                </button>
                            </div>

                            {/* SCROLLABLE CONTENT AREA */}
                            <div className="flex-1 overflow-y-auto p-6 scrollbar-thin scrollbar-thumb-white/10 scrollbar-track-transparent">

                                {/* === FLIGHT SCANNER TAB === */}
                                {activeTab === 'flights' && (
                                    <div className="space-y-6 animate-in slide-in-from-left-4 fade-in duration-500">

                                        <form onSubmit={handleSearchFlights} className="space-y-5">

                                            {/* FROM Input with Autocomplete */}
                                            <div className="relative z-50">
                                                <label className="text-[10px] font-bold text-blue-300 uppercase tracking-widest mb-1.5 block">Departure</label>
                                                <div className="relative group">
                                                    <div className="absolute left-4 top-3.5 text-gray-400 group-focus-within:text-blue-400 transition-colors"><MapPin className="w-5 h-5" /></div>
                                                    <input
                                                        type="text"
                                                        placeholder="Type airport code (e.g. LAX)..."
                                                        className="w-full bg-black/40 border border-white/10 rounded-xl py-3.5 pl-12 pr-4 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all font-mono"
                                                        value={fromSearch}
                                                        onChange={(e) => {
                                                            setFromSearch(e.target.value);
                                                            setShowFromSuggestions(true);
                                                        }}
                                                        onFocus={() => setShowFromSuggestions(true)}
                                                    />
                                                    {/* Autocomplete Dropdown */}
                                                    {showFromSuggestions && fromSearch.length > 0 && (
                                                        <div className="absolute top-full left-0 right-0 mt-2 bg-slate-900 border border-white/10 rounded-xl shadow-2xl max-h-60 overflow-y-auto z-50">
                                                            {getFilteredAirports(fromSearch).map(airport => (
                                                                <div
                                                                    key={airport.code}
                                                                    className="p-3 hover:bg-blue-600/20 cursor-pointer flex justify-between items-center border-b border-white/5 last:border-0 transition-colors"
                                                                    onClick={() => handleSelectAirport('from', airport)}
                                                                >
                                                                    <div>
                                                                        <div className="font-bold text-white">{airport.city}</div>
                                                                        <div className="text-xs text-gray-400">{airport.name}</div>
                                                                    </div>
                                                                    <div className="bg-white/10 px-2 py-1 rounded text-xs font-mono text-blue-300">{airport.code}</div>
                                                                </div>
                                                            ))}
                                                            {getFilteredAirports(fromSearch).length === 0 && (
                                                                <div className="p-3 text-sm text-gray-500">No airports found. Try a major hub code.</div>
                                                            )}
                                                        </div>
                                                    )}
                                                </div>
                                            </div>

                                            {/* TO Input with Autocomplete */}
                                            <div className="relative z-40">
                                                <label className="text-[10px] font-bold text-blue-300 uppercase tracking-widest mb-1.5 block">Arrival</label>
                                                <div className="relative group">
                                                    <div className="absolute left-4 top-3.5 text-gray-400 group-focus-within:text-blue-400 transition-colors"><MapPin className="w-5 h-5" /></div>
                                                    <input
                                                        type="text"
                                                        placeholder="Type destination (e.g. JFK)..."
                                                        className="w-full bg-black/40 border border-white/10 rounded-xl py-3.5 pl-12 pr-4 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all font-mono"
                                                        value={toSearch}
                                                        onChange={(e) => {
                                                            setToSearch(e.target.value);
                                                            setShowToSuggestions(true);
                                                        }}
                                                        onFocus={() => setShowToSuggestions(true)}
                                                    />
                                                    {/* Autocomplete Dropdown */}
                                                    {showToSuggestions && toSearch.length > 0 && (
                                                        <div className="absolute top-full left-0 right-0 mt-2 bg-slate-900 border border-white/10 rounded-xl shadow-2xl max-h-60 overflow-y-auto z-50">
                                                            {getFilteredAirports(toSearch).map(airport => (
                                                                <div
                                                                    key={airport.code}
                                                                    className="p-3 hover:bg-blue-600/20 cursor-pointer flex justify-between items-center border-b border-white/5 last:border-0 transition-colors"
                                                                    onClick={() => handleSelectAirport('to', airport)}
                                                                >
                                                                    <div>
                                                                        <div className="font-bold text-white">{airport.city}</div>
                                                                        <div className="text-xs text-gray-400">{airport.name}</div>
                                                                    </div>
                                                                    <div className="bg-white/10 px-2 py-1 rounded text-xs font-mono text-blue-300">{airport.code}</div>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    )}
                                                </div>
                                            </div>

                                            <div className="grid grid-cols-2 gap-4">
                                                <div>
                                                    <label className="text-[10px] font-bold text-blue-300 uppercase tracking-widest mb-1.5 block">Date</label>
                                                    <input type="date" className="w-full bg-black/40 border border-white/10 rounded-xl py-3 px-4 text-white focus:outline-none focus:ring-2 focus:ring-blue-500" />
                                                </div>
                                                <div>
                                                    <label className="text-[10px] font-bold text-blue-300 uppercase tracking-widest mb-1.5 block">Passengers</label>
                                                    <input type="number" min="1" defaultValue="1" className="w-full bg-black/40 border border-white/10 rounded-xl py-3 px-4 text-white focus:outline-none focus:ring-2 focus:ring-blue-500" />
                                                </div>
                                            </div>

                                            <button
                                                type="submit"
                                                disabled={isSearching}
                                                className="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-900/40 transition-all active:scale-[0.98] flex items-center justify-center gap-2 border border-white/10"
                                            >
                                                {isSearching ? (
                                                    <span className="flex items-center gap-2">
                                                        <div className="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin" />
                                                        Analyzing Routes...
                                                    </span>
                                                ) : (
                                                    <>
                                                        Initialize Scan <ArrowRight className="w-5 h-5" />
                                                    </>
                                                )}
                                            </button>
                                        </form>

                                        {/* Results List */}
                                        {flightResults.length > 0 && (
                                        <div className="space-y-4 pt-4 border-t border-white/10">
                                            <div className="flex justify-between items-end">
                                                <h2 className="text-lg font-bold text-white">Live Data Results</h2>
                                                <span className="text-xs text-green-400 font-mono">UPDATED 1m AGO</span>
                                            </div>

                                            {flightResults.map((flight) => (
                                                <div key={flight.id} className="group bg-white/5 hover:bg-white/10 border border-white/5 hover:border-blue-500/50 rounded-2xl p-4 transition-all cursor-pointer relative overflow-hidden">
                                                    <div className="absolute inset-0 bg-blue-500/5 opacity-0 group-hover:opacity-100 transition-opacity" />

                                                    <div className="relative flex justify-between items-start mb-4">
                                                        <div className="flex items-center gap-3">
                                                            <div className="w-10 h-10 rounded-full bg-gradient-to-br from-gray-800 to-black border border-white/10 flex items-center justify-center">
                                                                <Plane className="w-5 h-5 text-blue-400" />
                                                            </div>
                                                            <div>
                                                                <div className="font-bold text-white">{flight.airline}</div>
                                                                <div className="text-[10px] text-gray-500 uppercase tracking-wider">{flight.code} • {flight.aircraft}</div>
                                                            </div>
                                                        </div>
                                                        <div className="text-right">
                                                            <div className="text-2xl font-bold text-white tracking-tight">${flight.price}</div>
                                                            <div className="text-xs font-bold text-blue-400">{flight.class}</div>
                                                        </div>
                                                    </div>

                                                    <div className="relative flex items-center justify-between text-sm bg-black/40 rounded-xl p-3 border border-white/5">
                                                        <div className="text-center min-w-[60px]">
                                                            <div className="font-bold text-white">{flight.departure}</div>
                                                            <div className="text-xs text-gray-500">{flightForm.from?.code}</div>
                                                        </div>

                                                        <div className="flex-1 px-4 flex flex-col items-center">
                                                            <div className="text-[10px] text-gray-400 mb-1">{flight.duration}</div>
                                                            <div className="w-full h-[2px] bg-gray-700 relative">
                                                                <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-gray-900 px-2 text-[10px] text-gray-500 whitespace-nowrap">
                                                                    {flight.stops}
                                                                </div>
                                                            </div>
                                                        </div>

                                                        <div className="text-center min-w-[60px]">
                                                            <div className="font-bold text-white">{flight.arrival}</div>
                                                            <div className="text-xs text-gray-500">{flightForm.to?.code}</div>
                                                        </div>
                                                    </div>

                                                    <div className="mt-3 flex items-center gap-4 text-xs text-gray-500">
                                                        <div className="flex items-center gap-1">
                                                            <Shield className="w-3 h-3 text-green-500" />
                                                            <span>Emissions: {flight.emissions}</span>
                                                        </div>
                                                        <div className="flex items-center gap-1">
                                                            <Info className="w-3 h-3" />
                                                            <span>Gate TBD</span>
                                                        </div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                        )}
                                    </div>
                                )}

                                {/* === HOME PLANNER TAB === */}
                                {activeTab === 'commute' && (
                                    <div className="space-y-6 animate-in slide-in-from-right-4 fade-in duration-500">
                                        <div className="bg-emerald-500/10 border border-emerald-500/20 p-4 rounded-xl flex items-start gap-3">
                                            <Navigation className="w-5 h-5 text-emerald-400 mt-1 shrink-0" />
                                            <div>
                                                <h3 className="text-emerald-400 font-bold text-sm">Real-Time Traffic Uplink</h3>
                                                <p className="text-emerald-200/60 text-xs mt-1">
                                                    Google Places API connected. Start typing your address to lock in GPS coordinates for precision routing.
                                                </p>
                                            </div>
                                        </div>

                                        <form onSubmit={handleCalculateCommute} className="space-y-5">

                                            {/* HOME ADDRESS - GOOGLE PLACES AUTOCOMPLETE */}
                                            <div>
                                                <label className="text-[10px] font-bold text-emerald-300 uppercase tracking-widest mb-1.5 block">Start: Home Address</label>
                                                <div className="relative">
                                                    <Home className="absolute left-4 top-3.5 w-5 h-5 text-gray-400 z-10" />
                                                    <input
                                                        ref={homeInputRef}
                                                        type="text"
                                                        placeholder="Enter your street address..."
                                                        className="w-full bg-black/40 border border-white/10 rounded-xl py-3.5 pl-12 pr-4 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-all"
                                                        onChange={(e) => setCommuteAddress(e.target.value)}
                                                    />
                                                </div>
                                            </div>

                                            {/* TARGET AIRPORT SELECTOR */}
                                            <div>
                                                <label className="text-[10px] font-bold text-emerald-300 uppercase tracking-widest mb-1.5 block">End: Departure Airport</label>
                                                <div className="relative">
                                                    <Plane className="absolute left-4 top-3.5 w-5 h-5 text-gray-400 z-10" />
                                                    <select
                                                        className="w-full bg-black/40 border border-white/10 rounded-xl py-3.5 pl-12 pr-4 text-white focus:outline-none focus:ring-2 focus:ring-emerald-500 appearance-none cursor-pointer"
                                                        onChange={(e) => {
                                                            const airport = US_AIRPORTS.find(a => a.code === e.target.value);
                                                            setSelectedHomeAirport(airport);
                                                        }}
                                                        value={selectedHomeAirport?.code || 'JFK'}
                                                    >
                                                        {US_AIRPORTS.map(airport => (
                                                            <option key={airport.code} value={airport.code}>
                                                                {airport.code} - {airport.name}
                                                            </option>
                                                        ))}
                                                    </select>
                                                </div>
                                            </div>

                                            <button
                                                type="submit"
                                                className="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold py-4 rounded-xl shadow-lg shadow-emerald-900/40 transition-all active:scale-[0.98] flex items-center justify-center gap-2 border border-white/10"
                                            >
                                                Calculate Route <MapPin className="w-5 h-5" />
                                            </button>
                                        </form>

                                        {/* COMMUTE RESULTS */}
                                        {commuteData && (
                                        <div className="mt-4 bg-white/5 backdrop-blur-md rounded-2xl border border-emerald-500/30 overflow-hidden animate-in zoom-in-95 duration-300">
                                            <div className="bg-emerald-600/90 p-4 flex items-center justify-between backdrop-blur-sm">
                                                <div className="font-bold text-white flex items-center gap-2">
                                                    <Navigation className="w-5 h-5" /> Trip Summary
                                                </div>
                                                <div className="flex gap-2">
                                                    <span className="text-[10px] bg-black/20 px-2 py-1 rounded text-white font-mono">TRAFFIC: NORMAL</span>
                                                </div>
                                            </div>

                                            <div className="p-6">
                                                <div className="flex items-center justify-between mb-6">
                                                    <div>
                                                        <div className="text-4xl font-black text-white">{commuteData.duration}</div>
                                                        <div className="text-xs text-emerald-400 uppercase tracking-widest mt-1">Est. Drive Time</div>
                                                    </div>
                                                    <div className="text-right">
                                                        <div className="text-2xl font-bold text-white text-opacity-70">{commuteData.distance}</div>
                                                        <div className="text-xs text-gray-500 uppercase tracking-widest mt-1">Total Distance</div>
                                                    </div>
                                                </div>

                                                <div className="space-y-4 relative">
                                                    {/* Connecting Line */}
                                                    <div className="absolute left-[9px] top-2 bottom-2 w-[2px] bg-gray-700" />

                                                    <div className="relative flex items-start gap-4">
                                                        <div className="w-5 h-5 rounded-full bg-emerald-500 border-4 border-gray-900 shrink-0 z-10" />
                                                        <div>
                                                            <div className="text-xs text-gray-500 uppercase font-bold mb-0.5">Start</div>
                                                            <div className="text-sm text-gray-300 leading-tight">{commuteData.start}</div>
                                                        </div>
                                                    </div>

                                                    <div className="relative flex items-start gap-4">
                                                        <div className="w-5 h-5 rounded-full bg-red-500 border-4 border-gray-900 shrink-0 z-10" />
                                                        <div>
                                                            <div className="text-xs text-gray-500 uppercase font-bold mb-0.5">End</div>
                                                            <div className="text-sm text-white font-bold leading-tight">{commuteData.end}</div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* Floating Controls for Presentation */}
                        <div className="hidden md:flex flex-col gap-3 absolute top-6 right-6">
                            <div className="bg-black/40 backdrop-blur-md border border-white/10 p-4 rounded-xl text-right">
                                <div className="text-xs text-blue-400 font-mono uppercase tracking-widest mb-1">Live Feed</div>
                                <div className="text-2xl font-bold text-white">US-East Node</div>
                            </div>
                        </div>

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
