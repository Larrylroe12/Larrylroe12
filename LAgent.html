<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L AGENT - Deep Architect Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        'fade-in-up': 'fadeInUp 0.5s ease-out forwards',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&family=Inter:wght@300;400;600&display=swap');
        body { font-family: 'Inter', sans-serif; background: #020205; color: white; overflow: hidden; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .scrollbar-thin::-webkit-scrollbar { width: 6px; }
        .scrollbar-thin::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); }
        .scrollbar-thin::-webkit-scrollbar-thumb { background: rgba(34, 211, 238, 0.3); border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Import Map for module resolution -->
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
            "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
            "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js",
            "lucide-react": "https://esm.sh/lucide-react@0.263.1"
        }
    }
    </script>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { initializeApp } from 'firebase/app';
        import {
            getAuth,
            signInAnonymously,
            onAuthStateChanged,
            signInWithCustomToken
        } from 'firebase/auth';
        import {
            getFirestore,
            collection,
            addDoc,
            query,
            orderBy,
            onSnapshot,
            serverTimestamp,
            limit
        } from 'firebase/firestore';
        import {
            Mic, MicOff, Send, Globe, Cpu, Activity, Volume2, VolumeX, Sparkles,
            Play, Square, Plane, Map as MapIcon, Calendar, ArrowRight, X, Clock,
            DollarSign, CloudLightning
        } from 'lucide-react';

        // --- THREE.JS GLOBE COMPONENT ---
        const GlobeBackground = () => {
            const mountRef = useRef(null);

            useEffect(() => {
                let scene, camera, renderer, particles, starfield, animationId;

                const initThreeJS = () => {
                    if (!mountRef.current) return;
                    const THREE = window.THREE;

                    scene = new THREE.Scene();
                    scene.fog = new THREE.FogExp2(0x020205, 0.0025);

                    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                    camera.position.z = 22;

                    renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    renderer.setPixelRatio(window.devicePixelRatio);
                    mountRef.current.appendChild(renderer.domElement);

                    // --- LAYER 1: THE CORE VORTEX (GLOBE) ---
                    const geometry = new THREE.BufferGeometry();
                    const count = 6000;
                    const positions = new Float32Array(count * 3);
                    const colors = new Float32Array(count * 3);
                    const color1 = new THREE.Color(0x00e5ff);
                    const color2 = new THREE.Color(0x2d00f7);

                    for (let i = 0; i < count; i++) {
                        const phi = Math.acos(-1 + (2 * i) / count);
                        const theta = Math.sqrt(count * Math.PI) * phi;
                        const r = 10;
                        const rVar = r + (Math.random() - 0.5) * 0.5;

                        positions[i * 3] = rVar * Math.cos(theta) * Math.sin(phi);
                        positions[i * 3 + 1] = rVar * Math.sin(theta) * Math.sin(phi);
                        positions[i * 3 + 2] = rVar * Math.cos(phi);

                        const mixedColor = color1.clone().lerp(color2, (positions[i*3+1] + r) / (2*r));
                        colors[i * 3] = mixedColor.r;
                        colors[i * 3 + 1] = mixedColor.g;
                        colors[i * 3 + 2] = mixedColor.b;
                    }

                    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
                    const material = new THREE.PointsMaterial({
                        size: 0.12, vertexColors: true, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending
                    });

                    particles = new THREE.Points(geometry, material);
                    scene.add(particles);

                    // --- LAYER 2: DEEP STARFIELD ---
                    const starGeo = new THREE.BufferGeometry();
                    const starCount = 2000;
                    const starPos = new Float32Array(starCount * 3);
                    for(let i=0; i<starCount*3; i++) {
                        starPos[i] = (Math.random() - 0.5) * 100;
                    }
                    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
                    const starMat = new THREE.PointsMaterial({
                        size: 0.1, color: 0xffffff, transparent: true, opacity: 0.4
                    });
                    starfield = new THREE.Points(starGeo, starMat);
                    scene.add(starfield);

                    // --- RINGS ---
                    const ringGeo = new THREE.TorusGeometry(12.5, 0.02, 16, 100);
                    const ringMat = new THREE.MeshBasicMaterial({ color: 0x4444ff, transparent: true, opacity: 0.15 });
                    const ring = new THREE.Mesh(ringGeo, ringMat);
                    ring.rotation.x = Math.PI / 2;
                    scene.add(ring);

                    const ring2 = ring.clone();
                    ring2.rotation.x = Math.PI / 3;
                    ring2.scale.set(1.3, 1.3, 1.3);
                    scene.add(ring2);

                    let mouseX = 0;
                    let mouseY = 0;
                    const onDocumentMouseMove = (event) => {
                        mouseX = (event.clientX - window.innerWidth / 2) * 0.001;
                        mouseY = (event.clientY - window.innerHeight / 2) * 0.001;
                    };
                    document.addEventListener('mousemove', onDocumentMouseMove);

                    const animate = () => {
                        animationId = requestAnimationFrame(animate);
                        particles.rotation.y += 0.002;
                        particles.rotation.x += (mouseY * 0.3 - particles.rotation.x) * 0.05;
                        particles.rotation.y += (mouseX * 0.3 - particles.rotation.y) * 0.05;
                        starfield.rotation.y -= 0.0005;
                        starfield.rotation.x += (mouseY * 0.05 - starfield.rotation.x) * 0.05;
                        const time = Date.now() * 0.0005;
                        particles.scale.setScalar(1 + Math.sin(time) * 0.01);
                        ring.rotation.z -= 0.005;
                        ring2.rotation.z += 0.003;
                        renderer.render(scene, camera);
                    };
                    animate();

                    const handleResize = () => {
                        if (!camera || !renderer) return;
                        camera.aspect = window.innerWidth / window.innerHeight;
                        camera.updateProjectionMatrix();
                        renderer.setSize(window.innerWidth, window.innerHeight);
                    };
                    window.addEventListener('resize', handleResize);

                    return () => {
                        window.removeEventListener('resize', handleResize);
                        document.removeEventListener('mousemove', onDocumentMouseMove);
                        if (mountRef.current && renderer.domElement) mountRef.current.removeChild(renderer.domElement);
                        cancelAnimationFrame(animationId);
                    };
                };

                initThreeJS();
            }, []);

            return React.createElement('div', { ref: mountRef, className: "fixed top-0 left-0 w-full h-full -z-10 bg-[#020205]" });
        };

        // --- FLIGHT SCANNER COMPONENT ---
        const FlightScannerOverlay = ({ flightData, onClose }) => {
            if (!flightData) return null;

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 animate-fade-in-up">
                    <div className="absolute inset-0 bg-[#0f172a] overflow-hidden">
                        <div className="absolute inset-0 opacity-20"
                             style={{
                               backgroundImage: 'radial-gradient(circle, #3b82f6 1px, transparent 1px)',
                               backgroundSize: '30px 30px'
                             }}
                        />
                         <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full h-full opacity-10">
                            <svg viewBox="0 0 100 50" className="w-full h-full fill-cyan-500">
                               <path d="M20,10 Q25,5 30,10 T40,15 T50,10 T60,20 T70,15 T80,25 V40 H10 V20 Z" />
                            </svg>
                         </div>
                        <div className="absolute top-1/2 left-0 w-full h-0.5 bg-gradient-to-r from-transparent via-cyan-500/50 to-transparent"></div>
                        <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 animate-float-plane">
                            <div className="relative">
                                <Plane size={64} className="text-cyan-400 drop-shadow-[0_0_15px_rgba(34,211,238,0.8)]" />
                                <div className="absolute -inset-4 bg-cyan-400/20 blur-xl rounded-full animate-pulse"></div>
                            </div>
                        </div>
                    </div>

                    <div className="relative w-full max-w-5xl h-[90vh] flex flex-col bg-black/40 backdrop-blur-2xl border border-white/10 rounded-3xl shadow-2xl overflow-hidden">
                        <div className="flex items-center justify-between p-6 border-b border-white/10 bg-black/20">
                           <div className="flex items-center gap-4">
                              <div className="p-3 bg-cyan-500/20 rounded-xl border border-cyan-500/50 text-cyan-400">
                                 <Plane size={24} />
                              </div>
                              <div>
                                 <h2 className="text-2xl font-bold text-white tracking-tight flex items-center gap-2">
                                    {flightData.origin} <ArrowRight size={20} className="text-gray-400"/> {flightData.destination}
                                 </h2>
                                 <p className="text-sm text-cyan-300 font-mono flex items-center gap-2">
                                    <Calendar size={14}/> {flightData.date} • {flightData.flights?.length || 0} Flights Found
                                 </p>
                              </div>
                           </div>
                           <button onClick={onClose} className="p-2 hover:bg-white/10 rounded-full transition-colors">
                              <X size={24} className="text-gray-400 hover:text-white" />
                           </button>
                        </div>

                        <div className="flex-1 overflow-y-auto p-6 space-y-4 scrollbar-thin">
                           {flightData.summary && (
                             <div className="bg-blue-900/20 border border-blue-500/30 p-4 rounded-xl text-blue-100 text-sm mb-6">
                                {flightData.summary}
                             </div>
                           )}

                           <div className="grid gap-4">
                              {flightData.flights?.map((flight, idx) => (
                                 <div key={idx} className="group relative bg-white/5 hover:bg-white/10 border border-white/5 hover:border-cyan-500/50 rounded-2xl p-5 transition-all duration-300 flex flex-col md:flex-row items-center justify-between gap-6">
                                    <div className="flex items-center gap-4 w-full md:w-1/4">
                                       <div className="w-10 h-10 rounded-full bg-gradient-to-br from-gray-700 to-gray-900 flex items-center justify-center text-xs font-bold text-gray-300 border border-white/10">
                                          {flight.airline.slice(0,2).toUpperCase()}
                                       </div>
                                       <div>
                                          <p className="font-semibold text-white">{flight.airline}</p>
                                          <p className="text-xs text-gray-400">Flight {Math.floor(Math.random() * 9000) + 1000}</p>
                                       </div>
                                    </div>
                                    <div className="flex-1 flex items-center justify-center gap-8 w-full">
                                       <div className="text-center">
                                          <p className="text-xl font-mono font-bold text-white">{flight.departure}</p>
                                          <p className="text-xs text-gray-500">{flightData.origin}</p>
                                       </div>
                                       <div className="flex-1 flex flex-col items-center gap-1">
                                          <p className="text-[10px] text-gray-400">{flight.duration}</p>
                                          <div className="w-full h-[2px] bg-gray-700 relative flex items-center justify-center">
                                             <div className="absolute w-2 h-2 bg-gray-500 rounded-full left-0"></div>
                                             <div className="absolute w-2 h-2 bg-gray-500 rounded-full right-0"></div>
                                             <Plane size={12} className="text-gray-500 rotate-90" />
                                          </div>
                                          <p className="text-[10px] text-cyan-400 font-medium">{flight.stops || "Non-stop"}</p>
                                       </div>
                                       <div className="text-center">
                                          <p className="text-xl font-mono font-bold text-white">{flight.arrival}</p>
                                          <p className="text-xs text-gray-500">{flightData.destination}</p>
                                       </div>
                                    </div>
                                    <div className="w-full md:w-auto flex items-center justify-between md:flex-col md:items-end gap-2 pl-6 md:border-l border-white/10">
                                       <p className="text-2xl font-bold text-green-400">{flight.price}</p>
                                       <button className="px-6 py-2 bg-cyan-600 hover:bg-cyan-500 text-white text-sm font-medium rounded-xl transition-colors shadow-lg shadow-cyan-900/20">
                                          Select
                                       </button>
                                    </div>
                                 </div>
                              ))}
                           </div>
                        </div>
                    </div>
                    <style>{`
                        @keyframes float-plane {
                          0%, 100% { transform: translate(-50%, -50%) translateY(-10px) rotate(0deg); }
                          50% { transform: translate(-50%, -50%) translateY(10px) rotate(2deg); }
                        }
                        .animate-float-plane { animation: float-plane 6s ease-in-out infinite; }
                    `}</style>
                </div>
            );
        };

        // --- MAIN APP COMPONENT ---
        const LAgent = () => {
            const [user, setUser] = useState(null);
            const [input, setInput] = useState('');
            const [messages, setMessages] = useState([]);
            const [isListening, setIsListening] = useState(false);
            const [autoSpeak, setAutoSpeak] = useState(true);
            const [currentlySpeakingId, setCurrentlySpeakingId] = useState(null);
            const [isLoading, setIsLoading] = useState(false);
            const [flightModeData, setFlightModeData] = useState(null);

            const messagesEndRef = useRef(null);
            const recognitionRef = useRef(null);
            const synthRef = useRef(window.speechSynthesis);

            // --- FIREBASE INIT ---
            useEffect(() => {
                try {
                    const firebaseConfig = window.__firebase_config || {};
                    if (!firebaseConfig.apiKey) {
                        console.log("No Firebase config found. Starting in Guest Mode.");
                        return;
                    }
                    const app = initializeApp(firebaseConfig);
                    const auth = getAuth(app);

                    const initAuth = async () => {
                    try {
                        if (window.__initial_auth_token) {
                            await signInWithCustomToken(auth, window.__initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (err) { console.error("Auth Error", err); }
                    };
                    initAuth();
                    const unsubscribe = onAuthStateChanged(auth, setUser);
                    return () => unsubscribe();
                } catch (e) {
                    console.error("Firebase Init Failed:", e);
                }
            }, []);

            // --- FIRESTORE LISTENERS ---
            useEffect(() => {
                if (!user) return;
                const appId = window.__app_id || 'l-agent-default';

                // Only setup listener if config is valid, otherwise use local state
                if (window.__firebase_config && window.__firebase_config.apiKey) {
                    try {
                        const db = getFirestore();
                        const q = query(
                            collection(db, 'artifacts', appId, 'users', user.uid, 'messages'),
                            orderBy('timestamp', 'asc'),
                            limit(50)
                        );

                        const unsubscribe = onSnapshot(q, (snapshot) => {
                            const msgs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                            setMessages(msgs);
                            scrollToBottom();
                        }, (err) => console.error(err));

                        return () => unsubscribe();
                    } catch (e) { console.error("Firestore Listener Error:", e); }
                }
            }, [user]);

            const scrollToBottom = () => {
                messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            };

            useEffect(() => { scrollToBottom(); }, [messages]);

            // --- VOICE ---
            useEffect(() => {
                if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                    recognitionRef.current = new SpeechRecognition();
                    recognitionRef.current.continuous = false;
                    recognitionRef.current.interimResults = false;
                    recognitionRef.current.lang = 'en-US';

                    recognitionRef.current.onresult = (event) => {
                        const transcript = event.results[0][0].transcript;
                        setInput(transcript);
                        handleSend(transcript);
                    };
                    recognitionRef.current.onend = () => setIsListening(false);
                }
            }, []);

            const toggleVoice = () => {
                if (isListening) {
                    recognitionRef.current?.stop();
                } else {
                    recognitionRef.current?.start();
                    setIsListening(true);
                }
            };

            // --- TTS ---
            const speak = (text, messageId = 'system') => {
                if (!synthRef.current) return;
                if (synthRef.current.speaking && currentlySpeakingId === messageId) {
                    synthRef.current.cancel();
                    setCurrentlySpeakingId(null);
                    return;
                }
                synthRef.current.cancel();
                const cleanText = text.replace(/[*#_`]/g, '').replace(/\\[.*?\\]/g, '');
                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.rate = 1.1;
                utterance.pitch = 0.9;
                const voices = synthRef.current.getVoices();
                const preferred = voices.find(v => v.name.includes('Google US English') || v.name.includes('Samantha') || v.name.includes('Zira'));
                if (preferred) utterance.voice = preferred;
                utterance.onstart = () => setCurrentlySpeakingId(messageId);
                utterance.onend = () => setCurrentlySpeakingId(null);
                utterance.onerror = () => setCurrentlySpeakingId(null);
                synthRef.current.speak(utterance);
            };

            // --- GEMINI API ---
            const callGemini = async (prompt) => {
                // REPLACE THIS with your valid Google Cloud API Key
                const apiKey = "YOUR_GOOGLE_CLOUD_API_KEY";
                // Using Gemini 3.0 Pro model
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-pro-preview:generateContent?key=${apiKey}`;

                const systemPrompt = `
                You are L Agent.
                Role: User's Personal Google, Flight Analyst, and Expert Cloud Architect.
                Personality: Specialist, Highly Intelligent, Interactive, Concise.
                Knowledge Base: DeepMind, Vertex AI, Google Cloud Platform.

                CAPABILITIES:
                1. FLIGHTS:
                    If the user asks about flights (e.g., "Flight to X", "Find flights"), you MUST use Google Search to find real data, and then return a JSON object ONLY wrapped in \`\`\`json\`\`\`.
                    JSON Format for Flights:
                    {
                    "type": "flight_response",
                    "origin": "City Code",
                    "destination": "City Code",
                    "date": "YYYY-MM-DD",
                    "summary": "Brief analysis of the flights found.",
                    "flights": [
                        { "airline": "Name", "departure": "Time", "arrival": "Time", "duration": "Duration", "price": "$Price", "stops": "Non-stop/1 stop" }
                    ]
                    }

                2. ARCHITECTURE & CODING (Google DeepMind/Vertex/Cloud):
                    If the user asks to build, architect, or code something, you act as a Principal Engineer for Google Cloud.
                    - Prioritize Google Stack: Firebase, Cloud Run, Vertex AI, BigQuery.
                    - Use grounding to find the absolute latest API methods and documentation.
                    - Explain "how to do it" step-by-step with professional authority.

                For all other queries, return normal conversational text.
                `;

                const payload = {
                    contents: [{ role: "user", parts: [{ text: prompt }] }],
                    systemInstruction: { parts: [{ text: systemPrompt }] },
                    // Tools are not supported in this simple fetch without proper setup for google_search tool
                    // tools: [{ google_search: {} }]
                };

                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (!response.ok) {
                        const err = await response.json();
                        throw new Error(err.error?.message || "API Error");
                    }
                    const data = await response.json();
                    return {
                        content: data.candidates?.[0]?.content?.parts?.[0]?.text,
                        grounding: data.candidates?.[0]?.groundingMetadata
                    };
                } catch (e) {
                    console.error("Gemini API Error:", e);
                    return { content: "Connection to Vortex interrupted: " + e.message };
                }
            };

            const handleSend = async (textOverride = null) => {
                const text = textOverride || input;
                if (!text.trim() || isLoading) return;

                setInput('');
                setIsLoading(true);

                // Add User Message
                const userMsg = { role: 'user', text, timestamp: Date.now() };
                setMessages(p => [...p, userMsg]);

                // Store in Firestore if user is auth
                const appId = window.__app_id || 'l-agent-default';
                if (user && window.__firebase_config && window.__firebase_config.apiKey) {
                    try {
                        const db = getFirestore();
                        await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'messages'), {
                            role: 'user', text, timestamp: serverTimestamp()
                        });
                    } catch(e) { console.error("Firestore Error", e); }
                }

                const { content, grounding } = await callGemini(text);
                let finalText = content || "No data received.";

                // CHECK FOR FLIGHT JSON
                const jsonMatch = content?.match(/```json\n([\s\S]*?)\n```/);
                if (jsonMatch) {
                    try {
                        const parsedData = JSON.parse(jsonMatch[1]);
                        if (parsedData.type === 'flight_response') {
                            setFlightModeData(parsedData);
                            const summary = parsedData.summary || "I've pulled up the flight data for you.";
                            setMessages(prev => [...prev, { role: 'ai', text: summary, timestamp: Date.now() }]);
                            if (autoSpeak) speak(summary);
                            setIsLoading(false);
                            return;
                        }
                    } catch (e) {
                        console.error("JSON Parse Error", e);
                    }
                }

                // Normal Message Response
                setMessages(prev => [...prev, { role: 'ai', text: finalText, timestamp: Date.now() }]);
                if (user && window.__firebase_config && window.__firebase_config.apiKey) {
                     try {
                        const db = getFirestore();
                        await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'messages'), {
                            role: 'ai', text: finalText, timestamp: serverTimestamp()
                        });
                    } catch(e) { console.error("Firestore Error", e); }
                }

                if (autoSpeak) speak(finalText);
                setIsLoading(false);
            };

            const handleKeyDown = (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    handleSend();
                }
            };

            return (
                <div className="relative w-full h-screen text-white overflow-hidden">
                    <GlobeBackground />

                    {flightModeData && (
                        <FlightScannerOverlay
                            flightData={flightModeData}
                            onClose={() => setFlightModeData(null)}
                        />
                    )}

                    <div className="relative z-10 flex flex-col h-full max-w-4xl mx-auto p-4 md:p-6">
                        {/* Header */}
                        <div className="flex items-center justify-between mb-4 bg-black/30 backdrop-blur-md p-4 rounded-2xl border border-white/10">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-cyan-500/20 rounded-full flex items-center justify-center border border-cyan-500/50 animate-pulse-slow">
                                    <CloudLightning size={20} className="text-cyan-400" />
                                </div>
                                <div>
                                    <h1 className="text-xl font-bold font-mono tracking-tighter">L-AGENT <span className="text-xs text-cyan-500 bg-cyan-900/30 px-2 py-0.5 rounded ml-2">v5.0</span></h1>
                                    <div className="flex items-center gap-2 text-xs text-gray-400">
                                        <span className="w-2 h-2 bg-green-500 rounded-full"></span>
                                        ONLINE • {user ? 'SECURE LINK' : 'GUEST MODE'}
                                    </div>
                                </div>
                            </div>
                            <div className="flex items-center gap-2">
                                <button
                                    onClick={() => setAutoSpeak(!autoSpeak)}
                                    className={`p-2 rounded-lg border transition-all ${autoSpeak ? 'bg-cyan-500/20 border-cyan-500/50 text-cyan-400' : 'bg-white/5 border-white/10 text-gray-500'}`}
                                >
                                    {autoSpeak ? <Volume2 size={20} /> : <VolumeX size={20} />}
                                </button>
                            </div>
                        </div>

                        {/* Chat Area */}
                        <div className="flex-1 overflow-y-auto mb-4 space-y-4 pr-2 scrollbar-thin">
                            {messages.length === 0 && (
                                <div className="h-full flex flex-col items-center justify-center text-center opacity-50">
                                    <Sparkles size={48} className="text-cyan-500 mb-4 animate-pulse" />
                                    <p className="text-lg font-mono text-cyan-200">SYSTEM INITIALIZED</p>
                                    <p className="text-sm text-gray-400 max-w-md mt-2">I am ready to assist with architecture, code generation, and flight analysis.</p>
                                </div>
                            )}
                            {messages.map((msg, idx) => (
                                <div key={idx} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                    <div
                                        className={`max-w-[80%] p-4 rounded-2xl border backdrop-blur-sm ${
                                            msg.role === 'user'
                                            ? 'bg-cyan-600/20 border-cyan-500/30 text-cyan-50 rounded-tr-sm'
                                            : 'bg-black/40 border-white/10 text-gray-200 rounded-tl-sm'
                                        }`}
                                    >
                                        <div className="prose prose-invert text-sm whitespace-pre-wrap">
                                            {msg.text}
                                        </div>
                                        <div className="text-[10px] text-gray-500 mt-2 text-right opacity-70">
                                            {new Date(msg.timestamp).toLocaleTimeString()}
                                        </div>
                                    </div>
                                </div>
                            ))}
                            {isLoading && (
                                <div className="flex justify-start">
                                    <div className="bg-black/40 border border-white/10 p-4 rounded-2xl rounded-tl-sm flex items-center gap-2">
                                        <Activity size={16} className="text-cyan-500 animate-spin" />
                                        <span className="text-xs text-cyan-500 font-mono animate-pulse">PROCESSING DATA...</span>
                                    </div>
                                </div>
                            )}
                            <div ref={messagesEndRef} />
                        </div>

                        {/* Input Area */}
                        <div className="relative">
                            <div className="absolute inset-0 bg-gradient-to-t from-cyan-900/20 to-transparent blur-xl -z-10"></div>
                            <div className="bg-black/60 backdrop-blur-xl border border-white/10 rounded-2xl p-2 flex items-center gap-2 shadow-2xl">
                                <button
                                    onClick={toggleVoice}
                                    className={`p-3 rounded-xl transition-all ${isListening ? 'bg-red-500/20 text-red-400 animate-pulse border border-red-500/50' : 'hover:bg-white/10 text-gray-400'}`}
                                >
                                    {isListening ? <MicOff size={20} /> : <Mic size={20} />}
                                </button>
                                <textarea
                                    value={input}
                                    onChange={(e) => setInput(e.target.value)}
                                    onKeyDown={handleKeyDown}
                                    placeholder="Enter command or ask for flights..."
                                    className="flex-1 bg-transparent border-none outline-none text-white placeholder-gray-500 resize-none h-[24px] py-1 font-mono text-sm"
                                    rows={1}
                                />
                                <button
                                    onClick={() => handleSend()}
                                    disabled={!input.trim() || isLoading}
                                    className="p-3 bg-cyan-600 hover:bg-cyan-500 disabled:opacity-50 disabled:hover:bg-cyan-600 text-white rounded-xl transition-all shadow-lg shadow-cyan-900/20"
                                >
                                    <Send size={20} />
                                </button>
                            </div>
                            <div className="text-center mt-2">
                                <p className="text-[10px] text-gray-600 font-mono">POWERED BY GOOGLE CLOUD VERTEX AI</p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<LAgent />);
    </script>
</body>
</html>
