<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galactic Nav-Computer</title>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Share Tech Mono', monospace;
            color: #d4d4d4;
        }

        /* Scanline Effect for Screens */
        .scanlines {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.2) 50%,
                rgba(0,0,0,0.2)
            );
            background-size: 100% 4px;
            animation: scanline 10s linear infinite;
            pointer-events: none;
        }

        .screen-glow {
            box-shadow: 0 0 20px rgba(74, 222, 255, 0.2), inset 0 0 20px rgba(74, 222, 255, 0.1);
            border: 1px solid rgba(74, 222, 255, 0.3);
            background: rgba(10, 20, 30, 0.85);
        }

        .hologram-text {
            color: #4adeff;
            text-shadow: 0 0 5px rgba(74, 222, 255, 0.8);
        }

        .alert-text {
            color: #ff4a4a;
            text-shadow: 0 0 5px rgba(255, 74, 74, 0.8);
        }

        /* 3D Dashboard Perspective */
        .cockpit-perspective {
            perspective: 1200px;
            transform-style: preserve-3d;
        }

        .panel-left {
            transform: rotateY(25deg) translateZ(-50px);
            transform-origin: right center;
        }

        .panel-right {
            transform: rotateY(-25deg) translateZ(-50px);
            transform-origin: left center;
        }

        .panel-center {
            transform: rotateX(10deg) translateZ(-20px);
            transform-origin: bottom center;
        }

        .panel-top {
            transform: rotateX(-15deg);
            transform-origin: top center;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }
        ::-webkit-scrollbar-thumb {
            background: #333;
            border: 1px solid #555;
        }

        /* Animations */
        @keyframes flicker {
            0% { opacity: 0.95; }
            5% { opacity: 0.8; }
            10% { opacity: 0.95; }
            100% { opacity: 0.95; }
        }

        .hologram-flicker {
            animation: flicker 4s infinite;
        }

        /* Switch Toggle Styles */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #4adeff;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #4adeff;
        }

        .greeble-panel {
            background:
                linear-gradient(45deg, #222 25%, transparent 25%, transparent 75%, #222 75%, #222),
                linear-gradient(45deg, #222 25%, transparent 25%, transparent 75%, #222 75%, #222);
            background-color: #111;
            background-size: 10px 10px;
            background-position: 0 0, 5px 5px;
            box-shadow: inset 0 0 20px #000;
        }

        .btn-push {
            transition: all 0.1s;
            box-shadow: 0 4px 0 #333;
        }
        .btn-push:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #333;
        }

        /* Weathered Look */
        .scuff-mark {
            opacity: 0.3;
            pointer-events: none;
            mix-blend-mode: overlay;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- LUCIDE ICON COMPONENT HELPER ---
        const LucideIcon = ({ icon, size = 24, className = '', ...props }) => {
            if (!icon) return null;

            // Lucide definitions are arrays of children: [tag, attrs]
            // We need to render them into an SVG
            return (
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width={size}
                    height={size}
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    strokeWidth="2"
                    strokeLinecap="round"
                    strokeLinejoin="round"
                    className={className}
                    {...props}
                >
                    {icon.map((child, index) => {
                        const [tag, attrs] = child;
                        return React.createElement(tag, { ...attrs, key: index });
                    })}
                </svg>
            );
        };

        // --- ICONS ---
        // Get icon definitions from global lucide object
        // Depending on bundle, it might be window.lucide or window.lucide.icons
        const icons = window.lucide.icons ? window.lucide.icons : window.lucide;

        const ChevronLeft = (props) => <LucideIcon icon={icons.ChevronLeft} {...props} />;
        const ChevronRight = (props) => <LucideIcon icon={icons.ChevronRight} {...props} />;
        const Calendar = (props) => <LucideIcon icon={icons.Calendar} {...props} />;
        const Crosshair = (props) => <LucideIcon icon={icons.Crosshair} {...props} />;
        const Zap = (props) => <LucideIcon icon={icons.Zap} {...props} />;
        const Radio = (props) => <LucideIcon icon={icons.Radio} {...props} />;
        const MapIcon = (props) => <LucideIcon icon={icons.Map} {...props} />;
        const ShieldAlert = (props) => <LucideIcon icon={icons.ShieldAlert} {...props} />;
        const Activity = (props) => <LucideIcon icon={icons.Activity} {...props} />;


        // --- STARFIELD COMPONENT (Three.js) ---
        const StarField = ({ speedMode }) => {
            const mountRef = useRef(null);

            useEffect(() => {
                const scene = new THREE.Scene();
                // Add some subtle space fog
                scene.fog = new THREE.FogExp2(0x000000, 0.0005);

                const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });

                renderer.setSize(window.innerWidth, window.innerHeight);
                mountRef.current.appendChild(renderer.domElement);

                // Create Stars
                const starGeometry = new THREE.BufferGeometry();
                const starCount = 6000;
                const posArray = new Float32Array(starCount * 3);

                for(let i = 0; i < starCount * 3; i++) {
                    posArray[i] = (Math.random() - 0.5) * 2000; // Spread stars wide
                }

                starGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));

                const starMaterial = new THREE.PointsMaterial({
                    size: 1.5,
                    color: 0xffffff,
                    transparent: true,
                    opacity: 0.8
                });

                const starMesh = new THREE.Points(starGeometry, starMaterial);
                scene.add(starMesh);

                camera.position.z = 10;

                // Animation Loop
                let frameId;
                const animate = () => {
                    frameId = requestAnimationFrame(animate);

                    // WARP SPEED EFFECT LOGIC
                    let velocity = speedMode === 'hyper' ? 40 : 0.5;

                    const positions = starMesh.geometry.attributes.position.array;

                    for(let i = 2; i < starCount * 3; i += 3) {
                        positions[i] += velocity;

                        // Reset star if it passes camera
                        if (positions[i] > 200) {
                            positions[i] = -1000;

                            // Randomize X and Y again for variety
                            positions[i-1] = (Math.random() - 0.5) * 2000;
                            positions[i-2] = (Math.random() - 0.5) * 2000;
                        }
                    }

                    // Stretch stars in hyperspace
                    if (speedMode === 'hyper') {
                        starMesh.scale.z = 20;
                        starMaterial.opacity = 0.5;
                        starMaterial.color.setHex(0xaaaaaa);
                    } else {
                        // Smoothly return to normal
                        starMesh.scale.z = THREE.MathUtils.lerp(starMesh.scale.z, 1, 0.1);
                        starMaterial.opacity = THREE.MathUtils.lerp(starMaterial.opacity, 0.8, 0.1);
                        starMaterial.color.setHex(0xffffff);
                    }

                    starMesh.geometry.attributes.position.needsUpdate = true;
                    renderer.render(scene, camera);
                };

                animate();

                // Handle Resize
                const handleResize = () => {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                };
                window.addEventListener('resize', handleResize);

                return () => {
                    cancelAnimationFrame(frameId);
                    window.removeEventListener('resize', handleResize);
                    mountRef.current?.removeChild(renderer.domElement);
                    scene.remove(starMesh);
                    starGeometry.dispose();
                    starMaterial.dispose();
                    renderer.dispose();
                };
            }, [speedMode]);

            return <div ref={mountRef} className="fixed top-0 left-0 w-full h-full -z-10" />;
        };

        // --- UTILS ---
        const getDaysInMonth = (year, month) => new Date(year, month + 1, 0).getDate();
        const getFirstDayOfMonth = (year, month) => new Date(year, month, 1).getDay();

        // --- APP COMPONENT ---
        const App = () => {
            const [currentDate, setCurrentDate] = useState(new Date());
            const [selectedDate, setSelectedDate] = useState(new Date());
            const [speedMode, setSpeedMode] = useState('cruise'); // 'cruise' or 'hyper'
            const [viewMode, setViewMode] = useState('calendar'); // 'calendar' or 'tactical'
            const [engineStatus, setEngineStatus] = useState(true);

            // Mock Data Generator
            const generateEvents = (date) => {
                const seed = date.getDate() + date.getMonth();
                if (seed % 3 === 0) return [
                    { time: '0800', type: 'RECON', desc: 'Sector 7 Patrol', priority: 'low' },
                    { time: '1400', type: 'SUPPLY', desc: 'Docking at Outpost Beta', priority: 'med' }
                ];
                if (seed % 5 === 0) return [
                    { time: '2200', type: 'COMBAT', desc: 'Intercept Tie-Vanguard', priority: 'high' }
                ];
                return [];
            };

            const changeMonth = (offset) => {
                setSpeedMode('hyper');

                // Sound effect placeholder (in a real app, play audio here)

                setTimeout(() => {
                    const newDate = new Date(currentDate.getFullYear(), currentDate.getMonth() + offset, 1);
                    setCurrentDate(newDate);
                }, 400); // Wait for star stretch

                setTimeout(() => {
                    setSpeedMode('cruise');
                }, 1200); // Return to normal
            };

            const jumpToPresent = () => {
                setSpeedMode('hyper');
                setTimeout(() => {
                    const now = new Date();
                    setCurrentDate(now);
                    setSelectedDate(now);
                    setSpeedMode('cruise');
                }, 800);
            };

            const daysInMonth = getDaysInMonth(currentDate.getFullYear(), currentDate.getMonth());
            const firstDay = getFirstDayOfMonth(currentDate.getFullYear(), currentDate.getMonth());
            const days = [];

            // Empty slots for start of month
            for (let i = 0; i < firstDay; i++) {
                days.push(<div key={`empty-${i}`} className="h-16 md:h-24 bg-transparent border border-white/5 opacity-20"></div>);
            }

            // Days
            for (let d = 1; d <= daysInMonth; d++) {
                const dateToCheck = new Date(currentDate.getFullYear(), currentDate.getMonth(), d);
                const isSelected = selectedDate.getDate() === d && selectedDate.getMonth() === currentDate.getMonth() && selectedDate.getFullYear() === currentDate.getFullYear();
                const isToday = new Date().toDateString() === dateToCheck.toDateString();
                const events = generateEvents(dateToCheck);

                days.push(
                    <div
                        key={d}
                        onClick={() => setSelectedDate(dateToCheck)}
                        className={`
                            h-16 md:h-24 border relative cursor-pointer transition-all duration-200 group
                            ${isSelected ? 'bg-cyan-900/40 border-cyan-400 shadow-[0_0_15px_rgba(34,211,238,0.4)]' : 'bg-transparent border-slate-700/50 hover:bg-white/5'}
                            ${isToday ? 'border-yellow-500/80' : ''}
                        `}
                    >
                        <span className={`absolute top-1 left-2 font-bold ${isSelected ? 'text-cyan-300' : 'text-slate-400'}`}>{d}</span>

                        {/* Event Markers */}
                        <div className="absolute bottom-1 right-1 flex flex-col gap-1">
                            {events.map((e, idx) => (
                                <div key={idx} className={`w-1.5 h-1.5 rounded-full ${e.priority === 'high' ? 'bg-red-500 animate-pulse' : 'bg-green-500'}`}></div>
                            ))}
                        </div>

                        {/* Scanline hover effect */}
                        <div className="absolute inset-0 bg-cyan-400/10 scale-y-0 group-hover:scale-y-100 transition-transform origin-top pointer-events-none"></div>
                    </div>
                );
            }

            // --- SUB-COMPONENTS ---

            const ToggleSwitch = ({ label, active, onClick }) => (
                <div className="flex flex-col items-center gap-2">
                    <div
                        onClick={onClick}
                        className={`w-12 h-20 rounded border-2 border-gray-600 bg-gray-800 relative cursor-pointer shadow-inner transition-colors duration-300 ${active ? 'bg-gray-700' : ''}`}
                    >
                        <div className={`
                            w-full h-1/2 bg-gradient-to-b from-gray-400 to-gray-600 border-b border-black absolute left-0 transition-all duration-200
                            ${active ? 'top-0 rounded-t' : 'bottom-0 rounded-b opacity-50'}
                        `}></div>
                        <div className={`
                            w-8 h-8 bg-red-500 rounded-full absolute left-1.5 transition-all duration-200 shadow-[0_0_10px_red]
                            ${active ? 'top-2 bg-green-500 shadow-[0_0_10px_green]' : 'bottom-2 opacity-30'}
                        `}></div>
                    </div>
                    <span className="text-[10px] text-gray-400 tracking-widest font-bold uppercase">{label}</span>
                </div>
            );

            const TacticalButton = ({ label, onClick, color = "gray", icon: Icon }) => (
                <button
                    onClick={onClick}
                    className={`
                        btn-push relative px-4 py-3 rounded-sm border-b-4 font-bold text-xs tracking-widest flex items-center gap-2
                        ${color === 'red' ? 'bg-red-900 border-red-950 text-red-100 hover:bg-red-800' : ''}
                        ${color === 'cyan' ? 'bg-cyan-900 border-cyan-950 text-cyan-100 hover:bg-cyan-800' : ''}
                        ${color === 'yellow' ? 'bg-yellow-900 border-yellow-950 text-yellow-100 hover:bg-yellow-800' : ''}
                        ${color === 'gray' ? 'bg-gray-700 border-gray-900 text-gray-300 hover:bg-gray-600' : ''}
                    `}
                >
                    {Icon && <Icon size={14} />}
                    {label}
                </button>
            );

            return (
                <div className="w-full h-screen overflow-hidden relative text-white">
                    <StarField speedMode={speedMode} />

                    {/* Cockpit Container */}
                    <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                        <div className="w-[95%] h-[90%] md:w-[90%] md:h-[85%] cockpit-perspective flex flex-col md:flex-row gap-4 items-center md:items-end justify-center">

                            {/* --- LEFT PANEL: Status & Info --- */}
                            <div className="panel-left w-full md:w-1/4 h-64 md:h-[600px] greeble-panel border-4 border-gray-800 rounded-lg p-4 flex flex-col gap-4 shadow-2xl pointer-events-auto bg-gray-900/90 backdrop-blur-sm relative overflow-hidden">
                                <div className="absolute top-0 left-0 w-full h-1 bg-yellow-500/50"></div>

                                {/* Header */}
                                <div className="flex justify-between items-center border-b border-gray-700 pb-2 mb-2">
                                    <h2 className="text-xl font-bold text-yellow-500 tracking-widest flex items-center gap-2">
                                        <Activity size={18} /> SHIP STATUS
                                    </h2>
                                    <div className="w-3 h-3 bg-green-500 rounded-full animate-pulse"></div>
                                </div>

                                {/* Ship Diagram (CSS Art) */}
                                <div className="flex-1 border border-gray-700 bg-black/40 relative rounded p-4 flex items-center justify-center">
                                    <div className="text-cyan-500/30 w-full h-full flex items-center justify-center border border-cyan-500/20 rounded-full animate-spin-slow">
                                        <Crosshair size={120} />
                                    </div>
                                    <div className="absolute text-center">
                                        <div className="text-xs text-cyan-400 mb-1">SHIELD INTEGRITY</div>
                                        <div className="text-2xl font-bold text-white">98%</div>
                                    </div>
                                    <div className="scanlines absolute inset-0"></div>
                                </div>

                                {/* Mission Log (Selected Date Info) */}
                                <div className="bg-black/60 border border-gray-600 p-3 rounded h-1/2 overflow-y-auto">
                                    <div className="text-xs text-gray-400 mb-2 border-b border-gray-700 pb-1">LOG ENTRY: {selectedDate.toLocaleDateString()}</div>
                                    {generateEvents(selectedDate).length > 0 ? (
                                        generateEvents(selectedDate).map((e, i) => (
                                            <div key={i} className="mb-3 p-2 bg-gray-800/50 border-l-2 border-yellow-500">
                                                <div className="flex justify-between text-xs font-bold text-yellow-400">
                                                    <span>{e.time}</span>
                                                    <span>[{e.type}]</span>
                                                </div>
                                                <div className="text-sm text-gray-300 mt-1 font-sans">{e.desc}</div>
                                            </div>
                                        ))
                                    ) : (
                                        <div className="text-gray-500 text-sm italic text-center mt-10">No flight logs recorded for this sector.</div>
                                    )}
                                </div>
                            </div>

                            {/* --- CENTER PANEL: The Calendar --- */}
                            <div className="panel-center w-full md:w-1/2 h-96 md:h-[500px] screen-glow rounded-xl relative overflow-hidden flex flex-col p-1 pointer-events-auto">
                                {/* Scanlines */}
                                <div className="scanlines absolute inset-0 z-10 pointer-events-none"></div>

                                {/* Calendar Header */}
                                <div className="flex justify-between items-center p-4 bg-cyan-950/30 border-b border-cyan-800">
                                    <button onClick={() => changeMonth(-1)} className="text-cyan-600 hover:text-cyan-400 transition-colors transform hover:scale-125"><ChevronLeft size={32} /></button>
                                    <h1 className="text-3xl font-bold tracking-[0.2em] text-cyan-400 drop-shadow-[0_0_10px_rgba(34,211,238,0.8)] orbitron">
                                        {currentDate.toLocaleString('default', { month: 'long' }).toUpperCase()} {currentDate.getFullYear()}
                                    </h1>
                                    <button onClick={() => changeMonth(1)} className="text-cyan-600 hover:text-cyan-400 transition-colors transform hover:scale-125"><ChevronRight size={32} /></button>
                                </div>

                                {/* Weekdays */}
                                <div className="grid grid-cols-7 border-b border-cyan-900/50 bg-black/20 text-center py-2 text-xs font-bold text-cyan-600/70 tracking-wider">
                                    {['SUN','MON','TUE','WED','THU','FRI','SAT'].map(d => <div key={d}>{d}</div>)}
                                </div>

                                {/* Days Grid */}
                                <div className="flex-1 overflow-y-auto p-2">
                                    <div className="grid grid-cols-7 gap-1">
                                        {days}
                                    </div>
                                </div>
                            </div>

                            {/* --- RIGHT PANEL: Controls --- */}
                            <div className="panel-right w-full md:w-1/4 h-64 md:h-[600px] greeble-panel border-4 border-gray-800 rounded-lg p-6 flex flex-col gap-6 shadow-2xl pointer-events-auto bg-gray-900/90 backdrop-blur-sm relative">
                                {/* Scuff marks */}
                                <div className="scuff-mark absolute top-10 right-10 w-20 h-20 border-t-2 border-r-2 border-white/20 rounded-full"></div>

                                <div className="border-b border-gray-700 pb-2">
                                    <h2 className="text-xl font-bold text-red-500 tracking-widest flex items-center gap-2">
                                        <Zap size={18} /> CONTROLS
                                    </h2>
                                </div>

                                {/* Toggles Row */}
                                <div className="flex justify-around bg-black/40 p-4 rounded border border-gray-700 inset-shadow">
                                    <ToggleSwitch
                                        label="HYPERDRIVE"
                                        active={speedMode === 'hyper'}
                                        onClick={() => setSpeedMode(prev => prev === 'cruise' ? 'hyper' : 'cruise')}
                                    />
                                    <ToggleSwitch
                                        label="ENGINES"
                                        active={engineStatus}
                                        onClick={() => setEngineStatus(!engineStatus)}
                                    />
                                    <ToggleSwitch
                                        label="DEFLECTORS"
                                        active={true}
                                        onClick={() => {}}
                                    />
                                </div>

                                {/* Action Buttons */}
                                <div className="flex flex-col gap-3 mt-auto">
                                    <TacticalButton
                                        label="JUMP TO PRESENT"
                                        icon={Radio}
                                        color="cyan"
                                        onClick={jumpToPresent}
                                    />
                                    <TacticalButton
                                        label="SCAN SECTOR"
                                        icon={MapIcon}
                                        color="yellow"
                                        onClick={() => alert('Scanning sector... No anomalies detected.')}
                                    />
                                    <TacticalButton
                                        label="RED ALERT"
                                        icon={ShieldAlert}
                                        color="red"
                                        onClick={() => alert('KLAXON! Battle stations!')}
                                    />
                                </div>

                                {/* Decor Text */}
                                <div className="mt-4 text-[10px] text-gray-600 font-mono text-center">
                                    SYSTEM VER: 4.8.15.16<br/>
                                    MFG: CORELLIAN ENG.
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
