  .stat-val { color: #00ffcc; font-weight: bold; }

  #controls {
    position: fixed; bottom: 20px; left: 50%;
    transform: translateX(-50%);
    display: flex; gap: 12px; z-index: 100;
  }
  .ctrl-btn {
    background: rgba(0,180,255,0.1);
    border: 1px solid rgba(0,200,255,0.3);
    color: #88ddff;
    padding: 8px 18px; font-size: 11px;
    letter-spacing: 2px; cursor: pointer;
    font-family: 'Courier New', monospace;
    text-transform: uppercase;
    transition: all 0.3s;
    pointer-events: all;
    border-radius: 2px;
  }
  .ctrl-btn:hover, .ctrl-btn.active {
    background: rgba(0,200,255,0.25);
    border-color: #00d4ff;
    color: #fff;
    box-shadow: 0 0 15px rgba(0,200,255,0.4);
  }

  #tooltip {
    position: fixed; z-index: 200;
    background: rgba(0,8,20,0.92);
    border: 1px solid rgba(0,200,255,0.5);
    border-radius: 4px;
    padding: 14px 18px;
    min-width: 220px;
    pointer-events: none;
    display: none;
    box-shadow: 0 0 30px rgba(0,150,255,0.3);
  }
  .tt-name {
    font-size: 16px; font-weight: bold; color: #fff;
    letter-spacing: 2px; margin-bottom: 4px;
  }
  .tt-sector {
    font-size: 10px; letter-spacing: 2px;
    color: #66aaff; margin-bottom: 10px;
    text-transform: uppercase;
  }
  .tt-row {
    display: flex; justify-content: space-between;
    font-size: 12px; color: #88ccff;
    margin: 4px 0; gap: 20px;
  }
  .tt-row span:last-child { color: #fff; font-weight: bold; }
  .tt-change-pos { color: #00ffaa !important; }
  .tt-change-neg { color: #ff4466 !important; }
  .tt-divider { border-top: 1px solid rgba(0,150,255,0.2); margin: 8px 0; }

  #panel {
    position: fixed; right: 20px; top: 50%;
    transform: translateY(-50%);
    width: 220px; z-index: 100;
    pointer-events: none;
  }
  .sector-item {
    display: flex; align-items: center;
    margin-bottom: 8px; cursor: pointer;
    pointer-events: all;
    padding: 6px 10px;
    border-radius: 3px;
    transition: background 0.2s;
  }
  .sector-item:hover { background: rgba(0,150,255,0.1); }
  .sector-dot {
    width: 10px; height: 10px;
    border-radius: 50%; margin-right: 10px; flex-shrink: 0;
    box-shadow: 0 0 8px currentColor;
  }
  .sector-name {
    font-size: 10px; letter-spacing: 1px;
    color: #88aacc; text-transform: uppercase;
    flex: 1;
  }
  .sector-pct {
    font-size: 10px; font-weight: bold;
    letter-spacing: 1px;
  }

  #crosshair {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    width: 20px; height: 20px;
    pointer-events: none; z-index: 50; opacity: 0.3;
  }
  #crosshair::before, #crosshair::after {
    content: ''; position: absolute; background: #00d4ff;
  }
  #crosshair::before { width: 1px; height: 100%; left: 50%; transform: translateX(-50%); }
  #crosshair::after { height: 1px; width: 100%; top: 50%; transform: translateY(-50%); }

  #loading {
    position: fixed; inset: 0;
    background: #000; display: flex;
    flex-direction: column; align-items: center; justify-content: center;
    z-index: 999; transition: opacity 1s;
  }
  #loading-title {
    font-size: 28px; color: #fff; letter-spacing: 6px;
    text-transform: uppercase; margin-bottom: 8px;
    text-shadow: 0 0 30px #00d4ff;
  }
  #loading-sub { font-size: 12px; color: #4488aa; letter-spacing: 3px; margin-bottom: 40px; }
  #loading-bar-wrap {
    width: 300px; height: 2px;
    background: rgba(0,150,255,0.2); border-radius: 2px; overflow: hidden;
  }
  #loading-bar {
    height: 100%; background: linear-gradient(90deg, #0066ff, #00ffcc);
    width: 0; transition: width 0.1s; border-radius: 2px;
    box-shadow: 0 0 10px #00d4ff;
  }
  #loading-status {
    font-size: 10px; color: #336688; letter-spacing: 2px;
    margin-top: 14px; text-transform: uppercase;
  }

  #help {
    position: fixed; bottom: 70px; left: 50%;
    transform: translateX(-50%);
    font-size: 10px; color: rgba(100,180,255,0.5);
    letter-spacing: 2px; text-align: center;
    pointer-events: none;
    text-transform: uppercase;

// ─── GUARD: abort gracefully if Three.js failed to load ─────────────────────
if (window._threeError || typeof THREE === 'undefined') {
  document.getElementById('loading-status').textContent = 'ERROR: Three.js did not load. Check network connection.';
  document.getElementById('loading-bar').style.background = '#ff4466';
  throw new Error('Three.js not available');
}

// ─── SCENE SETUP ────────────────────────────────────────────────────────────────
const scene    = new THREE.Scene();
const camera   = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 5000);

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
} catch(e) {
  document.getElementById('loading-status').textContent = 'ERROR: WebGL not supported by your browser.';

}

renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000005);
document.body.appendChild(renderer.domElement);

camera.position.set(0, 80, 280);
camera.lookAt(0, 0, 0);

// ─── LIGHTING ────────────────────────────────────────────────────────────────
const ambient = new THREE.AmbientLight(0x112244, 0.8);
scene.add(ambient);
const sunLight = new THREE.PointLight(0xffffff, 2, 1000);
sunLight.position.set(0, 0, 0);

// ─── BACKGROUND STARS ────────────────────────────────────────────────────────
function makeStarField(count, spread, size, color) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const theta = Math.random() * Math.PI * 2;
    const phi   = Math.acos((Math.random() * 2) - 1);
    const r     = spread * 0.5 + Math.random() * spread;
    pos[i*3]   = r * Math.sin(phi) * Math.cos(theta);
    pos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
    pos[i*3+2] = r * Math.cos(phi);
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({ color, size, sizeAttenuation: true });
  return new THREE.Points(geo, mat);
}
scene.add(makeStarField(8000, 2200, 1.2, 0xffffff));
scene.add(makeStarField(3000, 1500, 0.8, 0xaaccff));
scene.add(makeStarField(1500, 1800, 1.5, 0xffddaa));
scene.add(makeStarField(800,  1200, 1.0, 0xaaffcc));

// ─── NEBULA ────────────────────────────────────────────────────────────────
function makeNebula(count, cx, cy, cz, spread, color) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    pos[i*3]   = cx + (Math.random()-0.5)*spread;
    pos[i*3+1] = cy + (Math.random()-0.5)*spread*0.4;
    pos[i*3+2] = cz + (Math.random()-0.5)*spread;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({
    color, size: 2.5, sizeAttenuation: true,
    transparent: true, opacity: 0.12
  });
  return new THREE.Points(geo, mat);
}
scene.add(makeNebula(2000, 400,  50, -200, 300, 0x0044ff));
scene.add(makeNebula(2000, -500, -80, 100, 280, 0xff0066));
scene.add(makeNebula(1500, 100,  -120, 300, 250, 0x6600ff));
scene.add(makeNebula(1200, -300, 100,  -300, 200, 0x004488));

// ─── CENTRAL SUN (S&P 500) ────────────────────────────────────────────────────
const sunGeo = new THREE.SphereGeometry(12, 64, 64);
const sunMat = new THREE.MeshBasicMaterial({ color: 0xffeedd });
const sun    = new THREE.Mesh(sunGeo, sunMat);
scene.add(sun);

// Sun glow
const glowGeo = new THREE.SphereGeometry(18, 32, 32);
const glowMat = new THREE.MeshBasicMaterial({
  color: 0xff8800, transparent: true, opacity: 0.08, side: THREE.BackSide
});
scene.add(new THREE.Mesh(glowGeo, glowMat));
const glowGeo2 = new THREE.SphereGeometry(25, 32, 32);

  color: 0xff6600, transparent: true, opacity: 0.04, side: THREE.BackSide
});
scene.add(new THREE.Mesh(glowGeo2, glowMat2));

// Sun corona (ring)

const coronaMat = new THREE.MeshBasicMaterial({
  color: 0xffaa33, transparent: true, opacity: 0.06,
  side: THREE.DoubleSide

const corona = new THREE.Mesh(coronaGeo, coronaMat);

// ─── SECTOR PLANETS ───────────────────────────────────────────────────────────
const ORBIT_RADII = [55, 72, 88, 104, 118, 132, 146, 158, 170, 181, 192];
const sectorObjects = [];

function hexToThree(hex) {
  return new THREE.Color(hex);
}

SECTORS.forEach((sec, i) => {
  const r   = ORBIT_RADII[i];
  const ang = (i / SECTORS.length) * Math.PI * 2;

  // Orbit ring
  const orbitGeo = new THREE.RingGeometry(r - 0.3, r + 0.3, 128);
  const orbitMat = new THREE.MeshBasicMaterial({
    color: sec.color, transparent: true, opacity: 0.08,
    side: THREE.DoubleSide
  });
  const orbitMesh = new THREE.Mesh(orbitGeo, orbitMat);
  orbitMesh.rotation.x = Math.PI / 2;
  scene.add(orbitMesh);

  // Planet
  const pSize = 3 + sec.weight * 0.18;
  const pGeo  = new THREE.SphereGeometry(pSize, 32, 32);
  const pMat  = new THREE.MeshPhongMaterial({
    color: sec.color,
    emissive: new THREE.Color(sec.color).multiplyScalar(0.25),
    shininess: 80,
    specular: 0x334466
  });
  const planet = new THREE.Mesh(pGeo, pMat);
  planet.position.set(Math.cos(ang)*r, 0, Math.sin(ang)*r);
  scene.add(planet);

  // Planet glow
  const pgGeo = new THREE.SphereGeometry(pSize * 1.6, 16, 16);
  const pgMat = new THREE.MeshBasicMaterial({
    color: sec.color, transparent: true, opacity: 0.07, side: THREE.BackSide
  });
  const pGlow = new THREE.Mesh(pgGeo, pgMat);
  planet.add(pGlow);

  // Atmosphere ring (for some sectors)
  if (i % 3 === 0) {
    const rGeo = new THREE.RingGeometry(pSize*1.4, pSize*1.8, 32);
    const rMat = new THREE.MeshBasicMaterial({
      color: sec.color, transparent: true, opacity: 0.2, side: THREE.DoubleSide
    });
    const ring = new THREE.Mesh(rGeo, rMat);
    ring.rotation.x = 0.4;
    planet.add(ring);
  }

  sectorObjects.push({
    mesh: planet, sector: sec, index: i,
    orbitRadius: r, angle: ang,
    speed: 0.08 + i * 0.004,
    stocks: []
  });
});

// ─── STOCK STARS ──────────────────────────────────────────────────────────────
const stockObjects = [];
const raycaster    = new THREE.Raycaster();
const mouse        = new THREE.Vector2(-9999, -9999);

STOCKS_DATA.forEach((stock, idx) => {
  const sec   = sectorObjects[stock.sector];
  const col   = SECTORS[stock.sector].color;
  const size  = 0.4 + Math.log(stock.mktcap) * 0.22;

  const geo = new THREE.SphereGeometry(size, 12, 12);
  const mat = new THREE.MeshPhongMaterial({
    color: col,
    emissive: new THREE.Color(col).multiplyScalar(0.5),
    shininess: 120,
  });
  const mesh = new THREE.Mesh(geo, mat);

  // Orbit around sector
  const subR   = 6 + Math.random() * 14;
  const subAng = Math.random() * Math.PI * 2;
  const subSpd = 0.2 + Math.random() * 0.5;
  const tilt   = (Math.random() - 0.5) * 0.6;

  mesh.position.set(
    sec.mesh.position.x + Math.cos(subAng)*subR,
    Math.sin(tilt)*subR*0.5,
    sec.mesh.position.z + Math.sin(subAng)*subR
  );
  mesh.userData = { ...stock, isStock: true, sectorIdx: stock.sector, sectorName: SECTORS[stock.sector].name };
  scene.add(mesh);

  // Small star glow
  const sgGeo = new THREE.SphereGeometry(size * 2.2, 8, 8);
  const sgMat = new THREE.MeshBasicMaterial({
    color: col, transparent: true, opacity: 0.12, side: THREE.BackSide
  });
  mesh.add(new THREE.Mesh(sgGeo, sgMat));

  stockObjects.push({ mesh, stock, subR, subAng, subSpd, tilt, sectorIdx: stock.sector });
  sec.stocks.push(stockObjects[stockObjects.length - 1]);
});

const labelCanvas = document.createElement('canvas');
labelCanvas.width  = 256; labelCanvas.height = 64;

ctx.fillStyle = 'rgba(0,0,0,0)';

// ─── SECTOR LEGEND ────────────────────────────────────────────────────────────
const legend = document.getElementById('sector-legend');
SECTORS.forEach((sec, i) => {
  const div = document.createElement('div');
  div.className = 'sector-item';
  const chg = (Math.random() * 4 - 1).toFixed(2);

    <div class="sector-dot" style="background:#${sec.color.toString(16).padStart(6,'0')}; color:#${sec.color.toString(16).padStart(6,'0')}"></div>
    <div class="sector-name">${sec.abbr}</div>

  `;

});

// ─── INTERACTION ──────────────────────────────────────────────────────────────
let isDragging = false, lastX = 0, lastY = 0;
let rotX = 0.2, rotY = 0;
let targetRotX = 0.2, targetRotY = 0;
let camDist = 280, targetDist = 280;
let currentView = 'orbit';
let hoveredObj = null;

const cameraGroup = new THREE.Group();
scene.add(cameraGroup);

renderer.domElement.addEventListener('mousedown', e => {
  isDragging = true; lastX = e.clientX; lastY = e.clientY;
});
renderer.domElement.addEventListener('mouseup',   () => isDragging = false);
renderer.domElement.addEventListener('mouseleave',() => isDragging = false);
renderer.domElement.addEventListener('mousemove', e => {
  if (isDragging) {
    targetRotY += (e.clientX - lastX) * 0.004;
    targetRotX += (e.clientY - lastY) * 0.003;
    targetRotX = Math.max(-0.9, Math.min(0.9, targetRotX));
    lastX = e.clientX; lastY = e.clientY;
  }
  mouse.x = (e.clientX / innerWidth)  *  2 - 1;
  mouse.y = (e.clientY / innerHeight) * -2 + 1;
  updateTooltipPos(e.clientX, e.clientY);
});
renderer.domElement.addEventListener('wheel', e => {
  targetDist += e.deltaY * 0.3;
  targetDist = Math.max(40, Math.min(600, targetDist));
});
renderer.domElement.addEventListener('click', e => {
  if (hoveredObj) clickObject(hoveredObj);
});

// Touch support
renderer.domElement.addEventListener('touchstart', e => {
  isDragging = true;
  lastX = e.touches[0].clientX;
  lastY = e.touches[0].clientY;
});
renderer.domElement.addEventListener('touchmove', e => {
  e.preventDefault();
  if (isDragging) {
    targetRotY += (e.touches[0].clientX - lastX) * 0.004;
    targetRotX += (e.touches[0].clientY - lastY) * 0.003;
    targetRotX = Math.max(-0.9, Math.min(0.9, targetRotX));
    lastX = e.touches[0].clientX;
    lastY = e.touches[0].clientY;
  }
}, { passive: false });
renderer.domElement.addEventListener('touchend', () => isDragging = false);

function setView(v) {
  currentView = v;
  document.querySelectorAll('.ctrl-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + v).classList.add('active');
  if (v === 'galaxy') { targetDist = 500; targetRotX = 0.8; }
  else if (v === 'sector') { targetDist = 180; }
  else { targetDist = 280; targetRotX = 0.2; }
}
function resetCamera() {
  targetDist = 280; targetRotX = 0.2; targetRotY = 0;
  currentView = 'orbit';
  document.querySelectorAll('.ctrl-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-orbit').classList.add('active');
}
function focusSector(i) {
  const sec = sectorObjects[i];
  targetDist = 120;
  targetRotY = -sec.angle;
  targetRotX = 0.15;
}

let clickedStock = null;
function clickObject(obj) {
  if (obj.userData.isStock) {
    clickedStock = obj;
    // pulse animation on click
    obj.scale.set(2, 2, 2);
    setTimeout(() => obj.scale.set(1, 1, 1), 300);
  }
}

const tooltip = document.getElementById('tooltip');
function updateTooltipPos(cx, cy) {
  if (tooltip.style.display === 'block') {
    let tx = cx + 16, ty = cy - 10;
    if (tx + 240 > innerWidth)  tx = cx - 256;
    if (ty + 200 > innerHeight) ty = cy - 180;
    tooltip.style.left = tx + 'px';
    tooltip.style.top  = ty + 'px';
  }
}
function showTooltip(stock, cx, cy) {
  const chgCol = stock.chg >= 0 ? 'tt-change-pos' : 'tt-change-neg';
  const sign   = stock.chg >= 0 ? '+' : '';
  const col    = SECTORS[stock.sectorIdx].color;
  const hex    = '#' + col.toString(16).padStart(6,'0');
  tooltip.innerHTML = `
    <div class="tt-name">${stock.sym}</div>
    <div class="tt-sector" style="color:${hex}">${stock.sectorName}</div>
    <div class="tt-divider"></div>
    <div class="tt-row"><span>Price</span><span>$${stock.price.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}</span></div>
    <div class="tt-row"><span>Change</span><span class="${chgCol}">${sign}${stock.chg}%</span></div>
    <div class="tt-row"><span>Mkt Cap</span><span>$${stock.mktcap}B</span></div>
    <div class="tt-row"><span>Company</span><span style="font-size:10px">${stock.name}</span></div>
  `;
  tooltip.style.display = 'block';
  updateTooltipPos(cx, cy);
}
function hideTooltip() {
  tooltip.style.display = 'none';
}

// ─── LABEL SPRITES ───────────────────────────────────────────────────────────
function makeLabel(text, color) {
  const c   = document.createElement('canvas');
  c.width   = 256; c.height = 48;
  const x   = c.getContext('2d');
  x.fillStyle = 'rgba(0,0,0,0)';
  x.fillRect(0, 0, 256, 48);
  x.font      = 'bold 22px Courier New';
  x.fillStyle = color;
  x.textAlign = 'center';
  x.shadowColor = color;
  x.shadowBlur  = 8;
  x.fillText(text, 128, 30);
  const tex  = new THREE.CanvasTexture(c);
  const mat  = new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false });
  const spr  = new THREE.Sprite(mat);
  spr.scale.set(20, 6, 1);
  return spr;
}

sectorObjects.forEach((sec, i) => {
  const hex   = '#' + SECTORS[i].color.toString(16).padStart(6,'0');
  const label = makeLabel(SECTORS[i].abbr, hex);
  label.position.set(0, 5 + 3, 0);
  sec.mesh.add(label);
});

// ─── ANIMATION ────────────────────────────────────────────────────────────────
const clock = new THREE.Clock();
let lastHover = null;

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // Smooth camera
  rotX   += (targetRotX - rotX)   * 0.06;
  rotY   += (targetRotY - rotY)   * 0.06;
  camDist += (targetDist - camDist) * 0.06;

  camera.position.x = camDist * Math.sin(rotY) * Math.cos(rotX);
  camera.position.y = camDist * Math.sin(rotX);
  camera.position.z = camDist * Math.cos(rotY) * Math.cos(rotX);
  camera.lookAt(0, 0, 0);

  // Rotate sun
  sun.rotation.y = t * 0.1;
  corona.rotation.z = t * 0.05;

  // Animate sector planets
  sectorObjects.forEach((sec, i) => {
    const spd  = sec.speed * 0.15;
    sec.angle += spd * 0.008;
    const r    = sec.orbitRadius;
    sec.mesh.position.x = Math.cos(sec.angle) * r;
    sec.mesh.position.z = Math.sin(sec.angle) * r;
    sec.mesh.rotation.y = t * 0.3;
  });

  // Animate stock stars around their sector
  stockObjects.forEach(obj => {
    obj.subAng += obj.subSpd * 0.005;
    const sec   = sectorObjects[obj.sectorIdx];
    const px    = sec.mesh.position.x;
    const pz    = sec.mesh.position.z;
    obj.mesh.position.x = px + Math.cos(obj.subAng) * obj.subR;
    obj.mesh.position.z = pz + Math.sin(obj.subAng) * obj.subR;
    obj.mesh.position.y = Math.sin(obj.subAng * 0.7 + obj.tilt) * obj.subR * 0.3;
    obj.mesh.rotation.y = t;
  });

  // Raycast hover
  raycaster.setFromCamera(mouse, camera);
  const allMeshes = stockObjects.map(s => s.mesh);
  const hits      = raycaster.intersectObjects(allMeshes);

  if (hits.length > 0) {
    const obj = hits[0].object;
    if (obj !== lastHover) {
      if (lastHover) { lastHover.scale.set(1,1,1); }
      obj.scale.set(2.2, 2.2, 2.2);
      lastHover = obj;
      renderer.domElement.style.cursor = 'pointer';
    }
    hoveredObj = obj;
    const sd   = obj.userData;
    const rect = renderer.domElement.getBoundingClientRect();
    const cx   = (mouse.x * 0.5 + 0.5) * innerWidth;
    const cy   = (-(mouse.y - 1) * 0.5) * innerHeight;
    showTooltip(sd, cx, cy);
  } else {
    if (lastHover) {
      lastHover.scale.set(1,1,1);
      lastHover = null;
      renderer.domElement.style.cursor = 'default';
    }
    hoveredObj = null;
    hideTooltip();
  }

  // Pulse sun light
  sunLight.intensity = 1.8 + Math.sin(t * 0.8) * 0.3;

  renderer.render(scene, camera);
}

// ─── RESPONSIVE ───────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ─── LOADING SEQUENCE ─────────────────────────────────────────────────────────
// Start rendering immediately so the scene is live behind the loading screen
animate();

const bar      = document.getElementById('loading-bar');
const statTxt  = document.getElementById('loading-status');
const msgs = [
  'Mapping star systems...', 'Loading sector galaxies...',
  'Placing stock stars...', 'Calculating orbits...',
  'Calibrating photon drives...', 'Launch ready!'
];
let p = 0;
const loadInt = setInterval(() => {
  p += 4 + Math.random() * 8;
  if (p > 100) p = 100;
  bar.style.width = p + '%';
  statTxt.textContent = msgs[Math.min(Math.floor(p/18), msgs.length-1)];
  if (p >= 100) {
    clearInterval(loadInt);
    setTimeout(() => {
      const ld = document.getElementById('loading');
      ld.style.opacity = '0';
      setTimeout(() => { if (ld.parentNode) ld.remove(); }, 1000);
    }, 400);
  }
}, 60);

// Live ticker update
setInterval(() => {
  const base   = 4783.45;
  const change = (Math.random() - 0.48) * 2;
  const val    = base + change;
  const pct    = (change / base * 100).toFixed(2);
  document.getElementById('spx-val').textContent = val.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');
  const chgEl  = document.getElementById('spx-chg');
  chgEl.textContent = (change >= 0 ? '+' : '') + pct + '%';
  chgEl.style.color  = change >= 0 ? '#00ffcc' : '#ff4466';
}, 3000);
</script>
